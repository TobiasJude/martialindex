<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d">
  <title id="t">Guard family diagram</title>
  <desc id="d">Abstract diagram of the guard concept: bottom player using legs to control the top player, with families branching from a common center.</desc>
  <defs>
    <linearGradient id="well" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <radialGradient id="mist" cx="70%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#D8D8DC" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blood" cx="28%" cy="60%" r="35%">
      <stop offset="0%" stop-color="#8E1616" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#well)"/>
  <rect width="1200" height="675" fill="url(#mist)"/>
  <circle cx="320" cy="420" r="220" fill="url(#blood)"/>
  <circle cx="600" cy="340" r="70" fill="none" stroke="#8E1616" stroke-width="4"/>
  <circle cx="600" cy="340" r="18" fill="#E8E8EA"/>
  <line x1="600" y1="270" x2="600" y2="160" stroke="#E8E8EA" stroke-width="2.5" opacity="0.8"/>
  <line x1="540" y1="380" x2="420" y2="500" stroke="#E8E8EA" stroke-width="2.5" opacity="0.8"/>
  <line x1="660" y1="380" x2="780" y2="500" stroke="#E8E8EA" stroke-width="2.5" opacity="0.8"/>
  <line x1="540" y1="300" x2="400" y2="200" stroke="#E8E8EA" stroke-width="2.5" opacity="0.7"/>
  <line x1="660" y1="300" x2="800" y2="200" stroke="#E8E8EA" stroke-width="2.5" opacity="0.7"/>
  <circle cx="600" cy="150" r="28" fill="none" stroke="#E8E8EA" stroke-width="2.5"/>
  <circle cx="400" cy="510" r="28" fill="none" stroke="#E8E8EA" stroke-width="2.5"/>
  <circle cx="800" cy="510" r="28" fill="none" stroke="#E8E8EA" stroke-width="2.5"/>
  <circle cx="390" cy="190" r="24" fill="none" stroke="#E8E8EA" stroke-width="2"/>
  <circle cx="810" cy="190" r="24" fill="none" stroke="#E8E8EA" stroke-width="2"/>
</svg>
