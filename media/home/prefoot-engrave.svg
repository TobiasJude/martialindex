<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMin slice" role="img" aria-label="">
  <title>Martial Index engraving landscape</title>
  <defs>
    <pattern id="hatch-fine" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#2A2420" stroke-width="0.55" opacity="0.35"/>
    </pattern>
    <pattern id="hatch-med" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#1C1917" stroke-width="0.7" opacity="0.45"/>
    </pattern>
    <pattern id="hatch-cross" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M0 8 L8 0 M-2 2 L2 -2 M6 10 L10 6" stroke="#1C1917" stroke-width="0.45" opacity="0.28"/>
    </pattern>
    <pattern id="hatch-horiz" patternUnits="userSpaceOnUse" width="4" height="3">
      <line x1="0" y1="1.5" x2="4" y2="1.5" stroke="#2A2420" stroke-width="0.4" opacity="0.3"/>
    </pattern>
    <linearGradient id="skyFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6F3EB"/>
      <stop offset="55%" stop-color="#F1EDE3"/>
      <stop offset="100%" stop-color="#E8E2D4"/>
    </linearGradient>
  </defs>

  <!-- Paper ground -->
  <rect width="1600" height="900" fill="url(#skyFade)"/>

  <!-- Soft sky hatch (very light, upper third stays open for type) -->
  <g opacity="0.22" stroke="#2A2420" fill="none" stroke-width="0.7">
    <path d="M80 90c120-40 240-20 360 10s260 40 400-10 280-50 420-10" opacity="0.5"/>
    <path d="M200 140c100-30 220-10 320 15s240 25 360-5" opacity="0.35"/>
    <path d="M900 70c80-25 180-15 260 8s160 30 240 5" opacity="0.4"/>
    <!-- Engraved cloud volumes — sparse -->
    <ellipse cx="280" cy="110" rx="90" ry="28" fill="url(#hatch-fine)" stroke="none" opacity="0.5"/>
    <ellipse cx="1180" cy="95" rx="110" ry="32" fill="url(#hatch-fine)" stroke="none" opacity="0.4"/>
    <ellipse cx="720" cy="130" rx="70" ry="20" fill="url(#hatch-fine)" stroke="none" opacity="0.3"/>
  </g>

  <!-- Distant mountain range (mid-horizon ~42%) -->
  <g fill="none" stroke="#1C1917" stroke-width="1.15" stroke-linejoin="round">
    <path d="M0 420 L120 360 L220 390 L340 300 L460 370 L580 280 L720 350 L860 260 L980 340 L1120 290 L1280 360 L1420 310 L1600 380 L1600 520 L0 520 Z"
          fill="url(#hatch-fine)" stroke="#1C1917" opacity="0.55"/>
    <path d="M0 460 L180 400 L300 440 L450 360 L600 430 L780 350 L950 420 L1100 370 L1300 430 L1480 390 L1600 440"
          fill="none" opacity="0.7"/>
    <!-- Ridge hatch accents -->
    <path d="M340 300 L360 360 M580 280 L600 340 M860 260 L880 330 M1120 290 L1140 350" opacity="0.45" stroke-width="0.8"/>
  </g>

  <!-- Mid pine grove (left-center, leaves landscape readable) -->
  <g fill="#1C1917" opacity="0.72">
    <!-- Trees as engraved triangles with trunk -->
    <g transform="translate(160,430)">
      <path d="M0 120 L28 20 L56 120 Z" fill="url(#hatch-med)"/>
      <path d="M8 120 L28 45 L48 120 Z" fill="url(#hatch-cross)" opacity="0.6"/>
      <rect x="25" y="118" width="6" height="28" fill="#1C1917"/>
    </g>
    <g transform="translate(230,450)">
      <path d="M0 100 L22 10 L44 100 Z" fill="url(#hatch-med)"/>
      <rect x="19" y="98" width="5" height="22" fill="#1C1917"/>
    </g>
    <g transform="translate(90,455)">
      <path d="M0 90 L18 8 L36 90 Z" fill="url(#hatch-med)"/>
      <rect x="15" y="88" width="5" height="20" fill="#1C1917"/>
    </g>
    <g transform="translate(300,465)">
      <path d="M0 80 L16 5 L32 80 Z" fill="url(#hatch-med)"/>
      <rect x="13" y="78" width="4" height="18" fill="#1C1917"/>
    </g>
  </g>

  <!-- Right: dojo / training hall with tiled roof (engraved) -->
  <g transform="translate(1040,380)" stroke="#1C1917" fill="none" stroke-width="1.2" stroke-linejoin="round">
    <!-- Main hall mass -->
    <path d="M40 160 L40 280 L420 280 L420 160" fill="url(#hatch-fine)" opacity="0.85"/>
    <!-- Hip roof -->
    <path d="M20 160 L230 40 L440 160 Z" fill="url(#hatch-med)" opacity="0.9"/>
    <path d="M20 160 L440 160" stroke-width="1.4"/>
    <!-- Roof tile ridges -->
    <path d="M60 145 L230 55 L400 145" opacity="0.5" stroke-width="0.7"/>
    <path d="M90 145 L230 70 L370 145" opacity="0.4" stroke-width="0.6"/>
    <path d="M120 145 L230 85 L340 145" opacity="0.35" stroke-width="0.55"/>
    <!-- Engaved tile lines along eaves -->
    <path d="M40 160 L50 172 L70 160 L90 172 L110 160 L130 172 L150 160 L170 172 L190 160 L210 172 L230 160 L250 172 L270 160 L290 172 L310 160 L330 172 L350 160 L370 172 L390 160 L410 172 L420 160" opacity="0.55" stroke-width="0.7"/>
    <!-- Columns / engawa -->
    <path d="M80 160 L80 280 M160 160 L160 280 M240 160 L240 280 M320 160 L320 280 M380 160 L380 280" opacity="0.65"/>
    <!-- Engawa platform -->
    <path d="M30 280 L430 280 L440 300 L20 300 Z" fill="url(#hatch-horiz)" opacity="0.7"/>
    <!-- Sliding door suggestion -->
    <rect x="175" y="190" width="110" height="90" fill="url(#hatch-cross)" opacity="0.5"/>
    <path d="M230 190 L230 280" opacity="0.6"/>
    <!-- Small side annex -->
    <path d="M420 200 L500 200 L500 280 L420 280" fill="url(#hatch-fine)" opacity="0.75"/>
    <path d="M410 200 L460 150 L510 200 Z" fill="url(#hatch-med)" opacity="0.85"/>
  </g>

  <!-- Courtyard / ground plane with engraved grit -->
  <g fill="url(#hatch-horiz)" opacity="0.35">
    <path d="M0 560 Q400 520 800 545 T1600 530 L1600 900 L0 900 Z"/>
  </g>
  <g stroke="#1C1917" fill="none" stroke-width="0.85" opacity="0.5">
    <path d="M0 580 Q300 555 600 575 T1200 560 T1600 575"/>
    <path d="M0 640 Q400 610 800 635 T1600 620"/>
    <path d="M0 720 Q350 695 700 715 T1600 700"/>
  </g>

  <!-- Stone lantern (tōrō) left of courtyard -->
  <g transform="translate(420,560)" stroke="#1C1917" fill="none" stroke-width="1.1">
    <rect x="18" y="70" width="24" height="50" fill="url(#hatch-med)" opacity="0.8"/>
    <path d="M8 70 L52 70 L42 50 L18 50 Z" fill="url(#hatch-cross)" opacity="0.75"/>
    <rect x="22" y="30" width="16" height="22" fill="url(#hatch-fine)" opacity="0.7"/>
    <path d="M10 30 L50 30 L40 12 L20 12 Z" fill="url(#hatch-med)" opacity="0.8"/>
    <ellipse cx="30" cy="122" rx="28" ry="6" fill="url(#hatch-horiz)" opacity="0.5"/>
  </g>

  <!-- Training posts / makiwara suggestion -->
  <g transform="translate(620,600)" stroke="#1C1917" fill="none" stroke-width="1.15" opacity="0.75">
    <rect x="0" y="20" width="10" height="90" fill="url(#hatch-med)"/>
    <rect x="40" y="35" width="9" height="75" fill="url(#hatch-med)"/>
    <rect x="78" y="28" width="10" height="82" fill="url(#hatch-med)"/>
    <path d="M-8 110 L100 110" opacity="0.4"/>
  </g>

  <!-- Two small engraved figure silhouettes in stance (distant, calm) -->
  <g transform="translate(760,610)" fill="#1C1917" opacity="0.55">
    <!-- Figure A — ready stance -->
    <ellipse cx="12" cy="8" rx="6" ry="7"/>
    <path d="M12 14 L12 42 M12 22 L-2 34 M12 22 L26 32 M12 42 L4 68 M12 42 L22 68" fill="none" stroke="#1C1917" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Figure B — facing -->
    <g transform="translate(70,0)">
      <ellipse cx="12" cy="8" rx="6" ry="7"/>
      <path d="M12 14 L12 42 M12 22 L0 30 M12 22 L28 36 M12 42 L6 68 M12 42 L24 66" fill="none" stroke="#1C1917" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Bamboo stand right-front -->
  <g transform="translate(1480,520)" stroke="#1C1917" fill="none" stroke-width="1.3" opacity="0.7">
    <path d="M10 200 L18 20 M30 200 L36 10 M50 200 L54 35"/>
    <path d="M8 60 L56 55 M12 100 L58 96 M14 140 L56 138" stroke-width="0.7" opacity="0.5"/>
    <!-- Leaves -->
    <path d="M18 30 Q0 20 8 40 M36 20 Q55 8 48 32 M54 45 Q70 35 62 55" stroke-width="0.9"/>
  </g>

  <!-- Foreground engawa / path edge hatch -->
  <g opacity="0.4" fill="url(#hatch-cross)">
    <path d="M0 820 L1600 800 L1600 900 L0 900 Z"/>
  </g>

  <!-- Speckle / plate grain (subtle) -->
  <g fill="#1C1917" opacity="0.12">
    <circle cx="140" cy="500" r="1.2"/><circle cx="980" cy="480" r="0.9"/>
    <circle cx="540" cy="700" r="1.1"/><circle cx="1200" cy="650" r="0.8"/>
    <circle cx="300" cy="750" r="1"/><circle cx="850" cy="780" r="1.3"/>
    <circle cx="1450" cy="720" r="0.7"/><circle cx="70" cy="680" r="1"/>
  </g>
</svg>
