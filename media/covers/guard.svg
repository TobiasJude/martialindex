<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Guard cover">
  <defs>
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="55%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <radialGradient id="mist1" cx="22%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#E8E8EA" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#A8A8B0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mist2" cx="78%" cy="20%" r="48%">
      <stop offset="0%" stop-color="#C8C8D0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blood" cx="48%" cy="55%" r="38%">
      <stop offset="0%" stop-color="#5B8FD4" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#1E4A8C" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#base)"/>
  <g filter="url(#soft)">
    <circle cx="264" cy="225" r="380" fill="url(#mist1)"/>
    <circle cx="936" cy="180" r="300" fill="url(#mist2)"/>
    <circle cx="576" cy="495" r="260" fill="url(#blood)"/>
